<main><\/main>\n<div class=\"cd\" id=\"cd\"><\/div>\n<div class=\"warn\" id=\"warn\"><\/div>\n<canvas id=\"conf\"><\/canvas>\n\n<script>\nconst SCRIPT_URL='embedded';   // отправку выполняет внешняя страница\nconst toParent=m=>{try{parent.postMessage(m,'*');}catch(e){}};\n\n/* ===== Настройки опроса ===== */\nconst MAX_ATTEMPTS=3;                   // попыток на ученика (0 — без ограничения)\nconst PER_TYPE=4;                       // вопросов каждого вида (4 вида → 16 вопросов)\nconst TIME={sym:10,value:10,table:15,order:15};   // секунд на вопрос\nconst PTS=100, BONUS=50, FAST=1.5;      // очки за верный ответ; макс. бонус за скорость; ответ быстрее FAST с — полный бонус\nconst G_CORRECT=8, G_SPEED=2;           // оценка: правильность — до 8, скорость — до 2\n\nconst OPS={\n not:{s:'¬',name:'инверсия',read:'не A',rule:'меняет значение на противоположное',alt:'<span style=\"text-decoration:overline\">A<\/span> · НЕ A'},\n and:{s:'∧',name:'конъюнкция',p:2,f:(a,b)=>a&b,read:'A и B',rule:'истинна (1), только когда оба высказывания истинны',alt:'A &amp; B · A · B'},\n or:{s:'∨',name:'дизъюнкция',p:3,f:(a,b)=>a|b,read:'A или B',rule:'ложна (0), только когда оба высказывания ложны',alt:'A + B · A | B'},\n xor:{s:'⊕',name:'исключающее ИЛИ',p:3,f:(a,b)=>a^b,read:'либо A, либо B',rule:'истинно (1), когда значения разные',alt:'A XOR B'},\n imp:{s:'→',name:'импликация',p:4,f:(a,b)=>(1-a)|b,read:'если A, то B',rule:'ложна (0), только когда 1 → 0',alt:'A ⇒ B'},\n eq:{s:'↔',name:'эквивалентность',p:5,f:(a,b)=>a===b?1:0,read:'A тогда и только тогда, когда B',rule:'истинна (1), когда значения одинаковые',alt:'A ≡ B · A ⇔ B'}\n};\nconst ALL=['not','and','or','xor','imp','eq'],BIN=['and','or','xor','imp','eq'];\nconst TYPES={sym:'Обозначения',table:'Таблица истинности',order:'Порядок действий',value:'Вычисли'};\n\n/* ===== утилиты ===== */\nconst $=s=>document.querySelector(s);\nconst R=n=>Math.floor(Math.random()*n);\nconst pick=a=>a[R(a.length)];\nfunction shuffle(a){for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}\nfunction h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}\nconst esc=s=>String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\nconst cap=s=>s[0].toUpperCase()+s.slice(1);\nconst fmt=n=>String(Math.round(n*10)/10).replace('.',',');\nconst fio=()=>$('#fio').value.trim(),cls=()=>$('#cls').value;\nfunction setWho(lock){$('#fio').disabled=lock;$('#cls').disabled=lock;toParent({type:'lock',v:lock});}\nfunction reportAtt(){if(!fio()||!cls())return;const a=attGet();toParent({type:'att',n:a.n,best:a.best,max:MAX_ATTEMPTS});}\n\n/* ===== лампочка ===== */\nfunction lamp(on,cls=''){\n const rays=[[32,0,32,-7],[10,8,5,3],[54,8,59,3],[3,28,-4,28],[61,28,68,28]].map(r=>`<line x1=\"${r[0]}\" y1=\"${r[1]}\" x2=\"${r[2]}\" y2=\"${r[3]}\"/>`).join('');\n return `<svg class=\"lamp ${on?'on':''} ${cls}\" viewBox=\"-6 -10 76 92\"><g class=\"rays\">${rays}<\/g>\n <path class=\"glass\" d=\"M32 6a22 22 0 0 1 13 39.5c-3 2.5-4.5 5.5-4.5 9h-17c0-3.5-1.5-6.5-4.5-9A22 22 0 0 1 32 6z\"/>\n <path class=\"fil\" d=\"M26 54V44l3-7 3 6 3-6 3 7v10\"/>\n <rect x=\"23\" y=\"56\" width=\"18\" height=\"5\" rx=\"2\" fill=\"#94a3b8\"/><rect x=\"24\" y=\"62\" width=\"16\" height=\"5\" rx=\"2\" fill=\"#64748b\"/><rect x=\"27\" y=\"68\" width=\"10\" height=\"4\" rx=\"2\" fill=\"#475569\"/><\/svg>`;\n}\n$('#hlamp').innerHTML=lamp(true).replace('<svg','<svg style=\"width:30px;height:36px\"');\n\n/* ===== фоновый рисунок: схемы, нули и единицы ===== */\n(function(){\n const c='%234338ca';\n const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><g fill='none' stroke='${c}' stroke-opacity='.13' stroke-width='2'>\n <path d='M0 40h60v50h70v-30h60'/><path d='M260 130h-50v60h-80v40'/><path d='M20 260v-60h50v-40'/><path d='M150 0v30h40v40h70'/>\n <circle cx='60' cy='40' r='4'/><circle cx='130' cy='90' r='4'/><circle cx='210' cy='190' r='4'/><circle cx='70' cy='160' r='4'/><circle cx='190' cy='70' r='4'/>\n <rect x='95' y='150' width='34' height='24' rx='4'/><path d='M100 162h24'/><\/g>\n <g fill='${c}' fill-opacity='.10' font-family='Cambria Math,serif' font-size='26'>\n <text x='14' y='120'>1<\/text><text x='200' y='30'>0<\/text><text x='160' y='240'>∧<\/text><text x='230' y='110'>∨<\/text><text x='40' y='230'>⊕<\/text><text x='110' y='40'>→<\/text><text x='180' y='150'>¬<\/text><text x='90' y='215'>1<\/text><\/g><\/svg>`;\n document.body.style.backgroundImage=`url(\"data:image/svg+xml,${svg.replace(/\\n/g,'')}\"),linear-gradient(135deg,#e0e7ff 0%,#f5f3ff 45%,#e0f2fe 100%)`;\n})();\n\n/* ===== звук ===== */\nlet soundOn=true,AC=null;\n$('#snd').onclick=()=>{soundOn=!soundOn;$('#snd').textContent=soundOn?'🔊':'🔇';};\nfunction tone(f,d,type='sine',t0=0,vol=.18){\n if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();\n const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(AC.destination);\n const t=AC.currentTime+t0;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d);}catch(e){}\n}\nconst sndOk=()=>{tone(660,.12,'triangle');tone(990,.2,'triangle',.1);};\nconst sndBad=()=>{tone(180,.35,'sawtooth',0,.12);};\nconst sndTick=()=>tone(1200,.05,'square',0,.05);\nconst sndGo=()=>{tone(523,.15,'triangle');tone(659,.15,'triangle',.15);tone(784,.3,'triangle',.3);};\nconst sndCount=()=>tone(440,.15,'triangle');\nconst sndFin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',i*.14));\nconst sndClick=()=>tone(880,.05,'square',0,.06);\n\n/* ===== попытки (хранятся в браузере этого компьютера) ===== */\nconst attKey=()=>'blitzLogic|'+cls()+'|'+fio().toLowerCase().replace(/\\s+/g,' ');\nfunction attGet(){try{return JSON.parse(localStorage.getItem(attKey()))||{n:0,best:null};}catch(e){return {n:0,best:null};}}\nfunction attSet(v){try{localStorage.setItem(attKey(),JSON.stringify(v));}catch(e){}}\nfunction attClearAll(){try{Object.keys(localStorage).filter(k=>k.startsWith('blitzLogic|')).forEach(k=>localStorage.removeItem(k));}catch(e){}}\n\n/* ===== генерация вопросов ===== */\nfunction optsFrom(correct,pool,n=4){return shuffle([correct,...shuffle(pool.filter(x=>x!==correct)).slice(0,n-1)]);}\nfunction qSym(){\n const op=pick(ALL);\n if(R(2)) return {tp:'sym',text:`Как обозначается <b>${OPS[op].name}<\/b>?`,big:'',\n  opts:optsFrom(op,ALL).map(o=>({v:o,t:OPS[o].s})),symOpts:true,ans:op,right:`${OPS[op].name} — ${OPS[op].s}`};\n return {tp:'sym',text:'Что обозначает этот знак?',big:`<span class=\"f\">${OPS[op].s}<\/span>`,\n  opts:optsFrom(op,ALL).map(o=>({v:o,t:OPS[o].name})),ans:op,right:`${OPS[op].s} — ${OPS[op].name}`};\n}\nfunction qTable(){\n const op=pick(BIN),rows=[[0,0],[0,1],[1,0],[1,1]];\n const tb='<table class=\"tt f\"><tr><th>A<\/th><th>B<\/th><th>F<\/th><\/tr>'+rows.map(r=>`<tr><td>${r[0]}<\/td><td>${r[1]}<\/td><td class=\"r\">${OPS[op].f(r[0],r[1])}<\/td><\/tr>`).join('')+'<\/table>';\n return {tp:'table',text:'Какой операции соответствует таблица?',big:tb,\n  opts:optsFrom(op,BIN).map(o=>({v:o,t:`${OPS[o].s} ${OPS[o].name}`})),ans:op,right:`${OPS[op].s} ${OPS[op].name}`};\n}\nfunction qValue(){\n const op=pick(ALL);\n if(op==='not'){const a=R(2);return {tp:'value',text:'Чему равно значение?',big:`<span class=\"f\">¬${a} = ?<\/span>`,opts:[{v:0,t:'0'},{v:1,t:'1'}],ans:1-a,right:`¬${a} = ${1-a}`};}\n const a=R(2),b=R(2),r=OPS[op].f(a,b);\n return {tp:'value',text:'Чему равно значение?',big:`<span class=\"f\">${a} ${OPS[op].s} ${b} = ?<\/span>`,opts:[{v:0,t:'0'},{v:1,t:'1'}],ans:r,right:`${a} ${OPS[op].s} ${b} = ${r}`};\n}\nfunction tok(n){\n const wrap=a=>[{k:'('},...a,{k:')'}];\n if(n.t==='v')return [{k:'v',s:n.name}];\n if(n.t==='n'){const inner=tok(n.a);return [{k:'op',op:'not',id:n.id},...(n.a.t==='b'?wrap(inner):inner)];}\n let L=tok(n.a),Rt=tok(n.b);const p=OPS[n.op].p;\n if(n.a.t==='b'){const pa=OPS[n.a.op].p;if(pa>p||(pa===p&&(n.a.op!==n.op||n.op==='imp'||n.op==='eq')))L=wrap(L);}\n if(n.b.t==='b'){if(OPS[n.b.op].p>=p)Rt=wrap(Rt);}\n return [...L,{k:'op',op:n.op,id:n.id},...Rt];\n}\n/* выражение-«цепочка»: каждая операция использует результат предыдущей → порядок однозначный */\nfunction qOrder(){\n const nOps=R(4)?3:2;\n const used=shuffle(BIN.slice());const vars=shuffle(['A','B','C','D']);\n let node={t:'b',op:used.pop(),a:{t:'v',name:vars[0]},b:{t:'v',name:vars[1]},id:0};\n let notUsed=false,vi=2;\n for(let i=1;i<nOps;i++){\n  if(!notUsed&&node.t==='b'&&R(3)===0){node={t:'n',a:node,id:i};notUsed=true;}\n  else{const v={t:'v',name:vars[vi++%4]};node=R(2)?{t:'b',op:used.pop(),a:node,b:v,id:i}:{t:'b',op:used.pop(),a:v,b:node,id:i};}\n }\n const tokens=tok(node);\n const ask=nOps===3?pick([0,1,2]):pick([0,1]);\n const askTxt=ask===0?'первым':ask===nOps-1?'последним':'вторым';\n let big='',plain='',opsList=[];\n tokens.forEach(t=>{\n  if(t.k==='op'){big+=`<span class=\"opw\" data-id=\"${t.id}\"><span class=\"num\">${t.id+1}<\/span>${OPS[t.op].s}<\/span>`;plain+=(t.op==='not'?'¬':` ${OPS[t.op].s} `);opsList.push(t);}\n  else{big+=t.k==='v'?t.s:t.k;plain+=t.k==='v'?t.s:t.k;}\n });\n const target=opsList.find(t=>t.id===ask);\n return {tp:'order',text:`Какое действие выполнится <b>${askTxt}<\/b>?`,big:`<span class=\"f\">${big}<\/span>`,plain,\n  opts:shuffle(opsList.map(t=>({v:t.id,t:OPS[t.op].s}))),symOpts:true,ans:ask,orderQ:true,right:`${askTxt} — ${OPS[target.op].s}`};\n}\nfunction makeQuiz(){\n const gen={sym:qSym,table:qTable,order:qOrder,value:qValue};let qs=[];\n for(const tp in gen){const seen=new Set();let g=0;\n  while(qs.filter(q=>q.tp===tp).length<PER_TYPE&&g++<200){const q=gen[tp]();const k=q.text+q.big+q.ans;if(seen.has(k))continue;seen.add(k);qs.push(q);}}\n for(let t=0;t<200;t++){shuffle(qs);if(qs.every((q,i)=>i===0||q.tp!==qs[i-1].tp))break;}\n return qs;\n}\n\n/* ===== состояние ===== */\nlet game=null;\nconst inGame=()=>!!(game&&!game.done);\n\n/* ===== стартовый экран ===== */\nlet demo={a:1,b:0,op:'and'},demoTimer=null;\nfunction renderDemo(){\n const d=$('#demo');if(!d)return;\n const f=OPS[demo.op].f(demo.a,demo.b);\n d.innerHTML=`<div class=\"row\">${lamp(f===1).replace('<svg','<svg style=\"width:80px;height:97px\"')}<\/div>\n <div class=\"eq f\">${demo.a} ${OPS[demo.op].s} ${demo.b} = <b style=\"color:${f?'#fde047':'#cbd5e1'}\">${f}<\/b><\/div>\n <div class=\"row\"><button class=\"sw ${demo.a?'on':''}\" data-k=\"a\">A = ${demo.a}<\/button><button class=\"sw ${demo.b?'on':''}\" data-k=\"b\">B = ${demo.b}<\/button><\/div>\n <div class=\"row\">${BIN.map(o=>`<button class=\"chip f ${o===demo.op?'sel':''}\" data-op=\"${o}\">${OPS[o].s}<\/button>`).join('')}<\/div>\n <small>Пощёлкай выключателями и операциями — когда загорится лампочка?<\/small>`;\n d.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{demo[b.dataset.k]^=1;sndClick();stopDemoAuto();renderDemo();});\n d.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{demo.op=b.dataset.op;sndClick();stopDemoAuto();renderDemo();});\n}\nfunction stopDemoAuto(){clearInterval(demoTimer);demoTimer=null;}\nfunction showStart(){\n game=null;setWho(false);stopConf();stopDemoAuto();\n const N=PER_TYPE*4,m=$('main');m.innerHTML='';\n const bits=Array.from({length:12},()=>Array.from({length:60},()=>R(2)).join(' ')).join('\\n');\n const hero=h('div','hero',`<div class=\"bits\">${bits}<\/div>\n <div style=\"position:relative\"><h2>Готов проверить скорость мысли?<\/h2>\n <p>${N} вопросов по логическим операциям. Отвечай быстро, но думай — ошибка стоит дороже, чем лишняя секунда!<\/p>\n <p>Каждый верный ответ зажигает лампочку 💡<\/p>\n ${MAX_ATTEMPTS?`<span class=\"attempts\" id=\"attinfo\">Попыток: ${MAX_ATTEMPTS}<\/span>`:''}<\/div>\n <div class=\"demo\" id=\"demo\"><\/div>`);\n m.appendChild(hero);renderDemo();\n demoTimer=setInterval(()=>{demo.a=R(2);demo.b=R(2);demo.op=pick(BIN);renderDemo();},2600);\n const c=h('div','card');\n c.innerHTML=`<ul class=\"rules\">\n <li>Четыре вида вопросов: обозначения операций, таблица истинности, порядок действий, значение операции.<\/li>\n <li>На каждый вопрос — <b>10–15 секунд<\/b>. Не успел — ответ не засчитан. Отвечать можно мышкой или клавишами <b>1, 2, 3, 4<\/b>.<\/li>\n <li>Справка доступна только <b>до начала<\/b> опроса. Уходить со страницы во время опроса нельзя — уход отмечается в результате.<\/li>\n ${MAX_ATTEMPTS?`<li>У каждого — <b>${MAX_ATTEMPTS} попытки<\/b>, каждая попытка отправляется учителю.<\/li>`:''}<\/ul>\n <div class=\"pts\"><div class=\"pt g\"><b>${PTS}<\/b><span>очков за верный ответ<\/span><\/div>\n <div class=\"pt y\"><b>до +${BONUS}<\/b><span>бонус за скорость, только за верный ответ<\/span><\/div><\/div>\n <div><b>Как ставится оценка (из 10):<\/b><\/div>\n <div class=\"pts\"><div class=\"pt g\"><b>до ${G_CORRECT}<\/b><span>за правильность: ${G_CORRECT} × верные ответы ÷ ${N}<\/span><\/div>\n <div class=\"pt y\"><b>до ${G_SPEED}<\/b><span>за скорость: ${G_SPEED} × бонус ÷ ${N*BONUS}<\/span><\/div><\/div>\n <div>Сумму округляем. Всё верно, но медленно — <b>8<\/b>. Всё верно и быстро — <b>10<\/b>. С двумя ошибками — не больше <b>9<\/b>, как бы быстро ни отвечал.<\/div>`;\n m.appendChild(c);\n const bt=h('div','btns');\n const hb=h('button','btn help','📖 Справка');hb.onclick=showHelp;bt.appendChild(hb);\n const st=h('button','btn big','▶ Начать блиц-опрос');st.onclick=startGame;bt.appendChild(st);\n m.appendChild(bt);\n updAttInfo();\n}\nfunction updAttInfo(){const el=$('#attinfo');if(!el||!MAX_ATTEMPTS)return;if(!fio()||!cls()){el.textContent=`Попыток: ${MAX_ATTEMPTS}`;return;}const a=attGet();el.textContent=`Осталось попыток: ${Math.max(0,MAX_ATTEMPTS-a.n)} из ${MAX_ATTEMPTS}`+(a.best!=null?` · лучшая оценка: ${a.best}`:'');}\n$('#fio').addEventListener('input',updAttInfo);$('#cls').addEventListener('change',updAttInfo);\n\n/* ===== справка ===== */\nfunction showHelp(){\n if(inGame())return;stopDemoAuto();\n const m=$('main');m.innerHTML='';\n const top=h('div','btns');const b=h('button','btn sec','← Назад');b.onclick=showStart;top.appendChild(b);top.appendChild(h('h2','','Справка: логические операции'));m.appendChild(top);\n let s='<div class=\"card\" style=\"margin-bottom:0\">Высказывание может быть <b>истинным (1)<\/b> или <b>ложным (0)<\/b>: лампочка горит или не горит.<\/div><div class=\"hgrid\">';\n ALL.forEach(op=>{const o=OPS[op];\n  const tb=op==='not'?'<tr><th>A<\/th><th>¬A<\/th><\/tr><tr><td>0<\/td><td>1<\/td><\/tr><tr><td>1<\/td><td>0<\/td><\/tr>':\n   `<tr><th>A<\/th><th>B<\/th><th>A ${o.s} B<\/th><\/tr>`+[[0,0],[0,1],[1,0],[1,1]].map(r=>`<tr><td>${r[0]}<\/td><td>${r[1]}<\/td><td>${o.f(r[0],r[1])}<\/td><\/tr>`).join('');\n  s+=`<div class=\"hcard\"><div class=\"hname\">${cap(o.name)} <span class=\"f\">${o.s}<\/span><\/div><div>Читается: «${o.read}»<\/div><div class=\"halt\">Ещё записывают: <span class=\"f\">${o.alt}<\/span><\/div><div class=\"hrule\">${cap(o.rule)}<\/div><table class=\"tt small f\">${tb}<\/table><\/div>`;});\n s+='<\/div><div class=\"card\"><h3 style=\"margin-top:0;color:#1e3a8a\">Порядок выполнения операций<\/h3><ol><li>действия в скобках;<\/li><li>инверсия <span class=\"f\">¬<\/span>;<\/li><li>конъюнкция <span class=\"f\">∧<\/span>;<\/li><li>дизъюнкция <span class=\"f\">∨<\/span> и исключающее ИЛИ <span class=\"f\">⊕<\/span>;<\/li><li>импликация <span class=\"f\">→<\/span>;<\/li><li>эквивалентность <span class=\"f\">↔<\/span>.<\/li><\/ol>Операции одного уровня выполняются слева направо. Если инверсия стоит перед скобкой, она выполняется сразу после действий в этой скобке.<\/div>';\n m.appendChild(h('div','',s));\n const b2=h('button','btn big','▶ Я готов! Начать');b2.onclick=startGame;m.appendChild(b2);\n window.scrollTo(0,0);\n}\n\n/* ===== игра ===== */\nfunction startGame(){\n if(!fio()||!cls()){alert('Введите фамилию и имя и выберите класс вверху страницы.');toParent({type:'needWho'});return;}\n let att=attGet();\n if(MAX_ATTEMPTS&&att.n>=MAX_ATTEMPTS){alert(`Все ${MAX_ATTEMPTS} попытки уже использованы`+(a  s1.disabled=S.busy||S.controlStarted;
 s2.disabled=S.busy||!S.blitzDone;
 s2.title=S.blitzDone?'':'Станет доступна после блиц-опроса';
}
function show(name){
 S.stage=name;
 if(!frames[name])mkFrame(name);
 Object.keys(frames).forEach(k=>frames[k].hidden=(k!==name));
 updSteps();
 try{frames[name].contentWindow.focus();}catch(e){}
}
function goto(name){
 if(S.busy||name===S.stage)return;
 if(name==='control'){
  if(!S.blitzDone)return;
  if(!$('#fio').value.trim()||!$('#cls').value){alert('Введите фамилию и имя и выберите класс вверху страницы.');focusWho();return;}
  if(!S.controlStarted&&!confirm('Перейти к контрольной работе?\n\nВернуться к блиц-опросу после этого будет нельзя.'))return;
  lockWho(true);
 }
 if(name==='blitz'&&S.controlStarted)return;
 show(name);
}
$('#st1').onclick=()=>goto('blitz');
$('#st2').onclick=()=>goto('control');
function focusWho(){($('#fio').value.trim()?$('#cls'):$('#fio')).focus();}

/* ===== отправка результата в Google-таблицу ===== */
function reply(src,ok,noUrl){try{src.postMessage({type:'sendStatus',ok,noUrl:!!noUrl},'*');}catch(e){}}
function sendResult(data,src){
 if(!SCRIPT_URL){reply(src,false,true);return;}
 fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)})
  .then(()=>reply(src,true)).catch(()=>reply(src,false));
}

/* ===== новый ученик ===== */
function resetAll(){
 Object.values(frames).forEach(f=>f.remove());
 Object.keys(frames).forEach(k=>delete frames[k]);
 Object.assign(S,{stage:FIRST,blitzDone:false,controlStarted:false,controlDone:false,busy:false});
 $('#fio').value='';$('#cls').value='';lockWho(false);
 show(FIRST);$('#fio').focus();
}

/* ===== сообщения от этапов ===== */
window.addEventListener('message',e=>{
 const name=Object.keys(frames).find(k=>frames[k].contentWindow===e.source);
 if(!name)return;
 const m=e.data||{};
 switch(m.type){
  case 'lock': if(m.v)lockWho(true); break;                 // снимается только кнопкой «Следующий ученик»
  case 'needWho': focusWho(); break;
  case 'att': if(name==='blitz'&&m.n>=1){S.blitzDone=true;updSteps();} break;
  case 'blitzDone': S.blitzDone=true;updSteps(); break;
  case 'busy': S.busy=!!m.v;if(name==='control'&&m.v)S.controlStarted=true;updSteps(); break;
  case 'goControl': goto('control'); break;
  case 'result': if(name==='control')S.controlDone=true;updSteps();sendResult(m.data,frames[name].contentWindow); break;
  case 'next':
   if(MODE==='both'&&S.stage==='blitz'&&S.blitzDone&&!S.controlDone&&!confirm('Контрольная работа ещё не выполнена. Перейти к следующему ученику?'))break;
   resetAll(); break;
 }
});

/* ===== защита ===== */
window.addEventListener('beforeunload',e=>{if(S.busy){e.preventDefault();e.returnValue='';}});
document.addEventListener('keydown',e=>{if(S.busy&&(e.key==='F5'||((e.ctrlKey||e.metaKey)&&['r','R','к','К','u','U','г','Г'].includes(e.key))))e.preventDefault();});

show(FIRST);
</script>
